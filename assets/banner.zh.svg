<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#EDF1FA"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EFF4FF"/>
      <stop offset="1" stop-color="#F8FAFF"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E2A4A" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8CA0C6"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="878" height="298" rx="18" fill="url(#bg)" stroke="#DBE2F0"/>

  <!-- 卡片 1：冗长轨迹 -->
  <g>
    <rect x="40" y="64" width="232" height="176" rx="12" fill="#FFFFFF" stroke="#DFE6F2"/>
    <text x="58" y="94" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif" font-size="11" font-weight="600" fill="#5B6B8C" letter-spacing="0.3">时间线</text>
    <g transform="translate(58,108)">
      <rect x="0" y="0" width="1.5" height="78" rx="0.75" fill="#E2E8F4"/>
      <circle cx="0.75" cy="8" r="3.5" fill="#9FB2D6" stroke="#FFFFFF" stroke-width="1.2"/>
      <text x="12" y="12" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif" font-size="11" fill="#3D4A63">思考 · 正在推理…</text>
      <circle cx="0.75" cy="30" r="3.5" fill="#FBBF24" stroke="#FFFFFF" stroke-width="1.2"/>
      <text x="12" y="34" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif" font-size="11" fill="#3D4A63">工具 · search(query)</text>
      <circle cx="0.75" cy="52" r="3.5" fill="#60A5FA" stroke="#FFFFFF" stroke-width="1.2"/>
      <text x="12" y="56" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif" font-size="11" fill="#3D4A63">上下文 · 已注入 1</text>
      <circle cx="0.75" cy="74" r="3.5" fill="#9FB2D6" stroke="#FFFFFF" stroke-width="1.2"/>
      <text x="12" y="78" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif" font-size="11" fill="#3D4A63">思考 · 权衡中…</text>
    </g>
    <text x="136" y="222" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif" font-size="13" font-weight="600" fill="#5B6B8C">① 冗长轨迹</text>
  </g>

  <!-- 卡片 2：自动收起 -->
  <g>
    <rect x="324" y="64" width="232" height="176" rx="12" fill="#FFFFFF" stroke="#DFE6F2"/>
    <g filter="url(#lift)">
      <rect x="340" y="98" width="200" height="36" rx="8" fill="#FFFFFF" stroke="#D8E2F5"/>
      <text x="354" y="112" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif" font-size="16" fill="#8CA0C6">›</text>
      <text x="366" y="113" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif" font-size="11.5" font-weight="600" fill="#334155">已收起 3 个步骤</text>
      <text x="366" y="126" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif" font-size="10.5" fill="#64748B">工具调用 2 · 思考 1</text>
    </g>
    <rect x="340" y="150" width="200" height="28" rx="8" fill="url(#bar)" stroke="#E2E8F4"/>
    <text x="350" y="168" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif" font-size="11" fill="#64748B">↕ 点击可展开</text>
    <text x="418" y="222" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif" font-size="13" font-weight="600" fill="#5B6B8C">② 自动收起</text>
  </g>

  <!-- 卡片 3：趣味提示 -->
  <g>
    <rect x="608" y="64" width="232" height="176" rx="12" fill="#FFFFFF" stroke="#DFE6F2"/>
    <rect x="624" y="96" width="200" height="52" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="638" y="116" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif" font-size="11" font-weight="600" fill="#1E40AF">Deep diving…</text>
    <text x="638" y="136" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif" font-size="12" font-style="italic" fill="#2563EB">正在让工具跑个腿…</text>
    <circle cx="682" cy="126" r="1.2" fill="#3B82F6" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="688" cy="126" r="1.2" fill="#3B82F6" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.4s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="694" cy="126" r="1.2" fill="#3B82F6" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="1.4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <text x="638" y="162" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif" font-size="10.5" fill="#64748B">按类型 · 双语</text>
    <text x="714" y="222" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif" font-size="13" font-weight="600" fill="#5B6B8C">③ 趣味提示</text>
  </g>

  <line x1="278" y1="152" x2="316" y2="152" stroke="#8CA0C6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="562" y1="152" x2="600" y2="152" stroke="#8CA0C6" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
